help=Client FTP di Loiacono\n\
  \n\
  Utilizzo:\n\
    java -jar ftp-client.jar [opzioni]\n\
  \n\
  Esempio:\n\
    java -jar ftp-client.jar -h ftp.esempio.com -p 21 -d /percorso/di/download -l /percorso/locale
