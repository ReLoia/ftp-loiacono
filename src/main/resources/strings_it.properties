# CLI
## HELP
cli_local_help=Client FTP di Loiacono\n\
  \n\
  Comandi personalizzati o modificati:\n\
  - !help: Mostra questo messaggio di aiuto\n\
  - download <remote_file> <local_file>: Scarica un file dal server\n\
  - upload <local_file> <remote_file>: Carica un file sul server\n\
  - mv <remote_file> <remote_file>: Sposta un file sul server\n\
  - !list: Elenca i file nella directory corrente\n\
  - !nlst: Elenca i file nella directory corrente senza dettagli\n\
  - !cd <directory>: Cambia la directory corrente LOCALE\n\
  - !pwd: Mostra la directory corrente LOCALE\n\
  - !ls: Elenca i file LOCALI nella directory corrente
cli_missing_arguments=Argomenti mancanti per il comando, digita !help per ottenere aiuto
## GENERAL
cli_closing_control_connection=Il server sta chiudendo la connessione di controllo. Uscita in corso.
