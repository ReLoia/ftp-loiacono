local_help=Client FTP di Loiacono\n\
  \n\
  Comandi personalizzati o modificati:\n\
  - !help: Mostra questo aiuto\n\
  - download <file_remoto> <file_locale>: Scarica un file dal server\n\
  - upload <file_locale> <file_remoto>: Carica un file sul server\n\
  - mv <file_remoto> <file_remoto>: Sposta un file sul server\n\
  - !list: Mostra i file nella directory attuale\n\
  - !nlst: Mostra i file nella directory attuale senza dettagli\n\
  - !cd <directory>: Cambia la directory CORRENTE locale\n\
  - !pwd: Stampa la directory CORRENTE locale\n\
  - !ls: Mostra i file LOCALI nella directory corrente
