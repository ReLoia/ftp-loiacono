local_help=Loiacono's FTP Client\n\
  \n\
  Custom or Modified commands:\n\
  - !help: Show this help\n\
  - download <remote_file> <local_file>: Download a file from the server\n\
  - upload <local_file> <remote_file>: Upload a file to the server\n\
  - mv <remote_file> <remote_file>: Move a file on the server\n\
  - !list: List the files in the current directory\n\
  - !nlst: List the files in the current directory without details\n\
  - !cd <directory>: Change the LOCAL current directory\n\
  - !pwd: Print the LOCAL current directory\n\
  - !ls: List the LOCAL files in the current directory
