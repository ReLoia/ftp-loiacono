help=Loiacono's FTP Client\n\
  \n\
  Usage:\n\
    java -jar ftp-client.jar [options]\n\
  \n\
  Example:\n\
    java -jar ftp-client.jar -h ftp.example.com -p 21 -d /path/to/download -l /path/to/local
